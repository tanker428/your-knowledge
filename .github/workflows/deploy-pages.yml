name: Deploy to GitHub Pages

# Deploys only from main. Nothing here needs a secret: the site is fully static
# and ships no credentials, so the workflow has no `secrets` access at all.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # enablement: true turns Pages on for the repository if it is not yet
      # enabled, so no manual Settings → Pages step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Only dist/ is published — never the repo root, so node_modules, docs,
      # tests and .local-media can never end up on the public site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
